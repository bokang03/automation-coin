# 모의매매가 기본이다. 실매매는 mode: live 로 바꾸고 --live 옵션까지 줘야 실제 주문이 나간다.
mode: paper              # paper | live
exchange: binanceusdm    # ccxt 거래소 id (바이낸스 USDT 무기한 선물)
demo: false              # true 면 바이낸스 데모 계정(가짜 돈)으로 실제 주문 흐름을 시험
symbols:
  - BTC/USDT:USDT
poll_seconds: 60         # 손절 확인·새 봉 확인 주기
exchange_leverage: 3     # 거래소 레버리지 설정값(증거금 여유용). 실제 노출은 strategy.max_leverage 로 제한

paper:
  start_equity: 10000    # USDT
  fee: 0.0005
  slippage: 0.0002

strategy:                # 설명은 aoabot/strategy.py 의 Params
  move_th: 0.03
  vol_gate: 1.6
  stop_atr: 3.0
  max_hold_h: 12
  risk_per_trade: 0.01
  max_leverage: 2.0
  add_at_atr: 1.0
  add_frac: 0.5
  max_adds: 1

risk:
  daily_loss: 0.03
  max_drawdown: 0.25
